<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Apple Style Smooth Feature Section</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* SECTION */
      .mac-section {
        width: 100% !important;
        height: auto !important;
        min-height: fit-content !important;
        padding-top: 100px !important;
        padding-bottom: 80px !important;
        overflow: hidden !important;
        position: relative !important;
        background: #000 !important;
        border-radius: 16px;
      }

      /* BG */
      .bg-images {
        position: absolute !important;
        inset: 0 !important;
        height: 100% !important;
        width: 100% !important;
      }

      .bg-image {
        position: absolute !important;
        inset: 0 !important;

        width: 100% !important;
        height: 100% !important;

        object-fit: cover !important;
        object-position: center !important;

        opacity: 0;
        transform: scale(1.06);

        will-change: transform, opacity;
      }

      /* OVERLAY */
      .overlay {
        position: absolute !important;
        inset: 0 !important;
        height: 100% !important;
        width: 100% !important;

        background: linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.6) 0%,
          rgba(0, 0, 0, 0.2) 45%,
          rgba(0, 0, 0, 0.08) 100%
        ) !important;

        z-index: 1 !important;
      }

      /* CONTENT */
      .content {
        position: relative;
        z-index: 3;

        height: auto;

        display: flex;
        align-items: center;

        padding-left: 48px;
      }

      /* LEFT */
      .left-panel {
        width: 540px;
        padding-left: 30px;

        position: relative;
      }

      /* CLOSE */
      .close-btn {
        position: absolute;
        top: 22px;
        right: 22px;

        width: 36px !important;
        height: 36px !important;

        border: none !important;
        border-radius: 50% !important;

        background: rgba(255, 255, 255, 0.16) !important;
        backdrop-filter: blur(14px) !important;

        display: flex !important;
        align-items: center !important;
        justify-content: center !important;

        cursor: pointer !important;
        padding: 0 !important;
        margin: 0 !important;
        outline: none !important;
        box-shadow: none !important;

        z-index: 20 !important;

        opacity: 0;
        pointer-events: none;

        transition:
          transform 0.3s ease,
          background 0.3s ease,
          opacity 0.3s ease !important;
      }

      .close-btn:hover {
        transform: scale(1.05) !important;
        background: rgba(255, 255, 255, 0.24) !important;
      }

      .close-btn svg {
        display: block !important;
      }

      /* SIDE NAV */
      .side-nav {
        position: absolute;

        left: -4px;
        top: 50%;

        transform: translateY(-50%);

        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .nav-btn {
        width: 40px !important;
        height: 40px !important;

        border: none !important;
        border-radius: 50% !important;

        background: rgba(20, 20, 20, 0.72) !important;
        backdrop-filter: blur(14px) !important;

        display: flex !important;
        align-items: center !important;
        justify-content: center !important;

        cursor: pointer !important;
        padding: 0 !important;
        margin: 0 !important;
        outline: none !important;
        box-shadow: none !important;

        transition:
          transform 0.3s ease,
          background 0.3s ease !important;
      }

      .nav-btn:hover,
      .nav-btn:focus,
      .nav-btn:active {
        transform: scale(1.06) !important;
        background: rgba(40, 40, 40, 0.92) !important;
        outline: none !important;
        box-shadow: none !important;
      }

      .nav-btn svg {
        width: 16px !important;
        height: 16px !important;
        display: block !important;
      }

      /* LIST */
      .feature-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-left: 34px;
        align-items: flex-start;
        width: fit-content !important;
        position: relative !important;
      }

      /* ITEM */
      .feature-item {
        position: relative !important;
        width: fit-content;
        height: 50px !important; /* Fixed height for all items */
        display: flex !important;
        align-items: center !important;
        border-radius: 100px !important;
        background: rgba(32, 32, 32, 0.68) !important;
        backdrop-filter: blur(22px) !important;
        border: 1px solid rgba(255, 255, 255, 0.08) !important;
        transition:
          background 0.4s ease,
          border-color 0.4s ease,
          box-shadow 0.4s ease !important;
        overflow: visible !important;
      }

      .feature-item.active,
      .feature-item:hover {
        border-color: rgba(59, 130, 246, 0.8) !important;
        background: rgba(40, 40, 40, 0.85) !important;
        box-shadow: 0 0 25px rgba(59, 130, 246, 0.25) !important;
      }

      /* BUTTON */
      .feature-button {
        width: 100% !important;
        height: 100% !important; /* Take full height of parent */
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        gap: 8px !important;
        padding: 0 16px 0 20px !important;
        background: transparent !important;
        border: none !important;
        cursor: pointer !important;
        margin: 0 !important;
        outline: none !important;
        box-shadow: none !important;
        text-transform: none !important;
        white-space: nowrap !important;
        flex-wrap: nowrap !important;
      }

      .feature-button-left {
        display: flex !important;
        align-items: center !important;
        gap: 0 !important;
        white-space: nowrap !important;
        flex-wrap: nowrap !important;
        flex-shrink: 0 !important;
      }

      .right-arrow {
        color: #fff !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        opacity: 0.85; /* Visible by default */
        transition: opacity 0.3s ease !important;
        margin-right: 2px;
      }

      .feature-item:hover .right-arrow,
      .feature-item.active .right-arrow {
        opacity: 1 !important;
      }

      /* ICON */
      .plus {
        width: 24px !important;
        height: 24px !important;
        border-radius: 50% !important;
        border: 1px solid rgba(255, 255, 255, 0.22) !important;
        position: relative !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        flex-shrink: 0 !important;
        transition:
          border-color 0.35s ease,
          background 0.35s ease,
          transform 0.4s ease !important;
        margin-right: 0px;
      }

      .plus span:first-child {
        position: absolute;
        width: 10px;
        height: 1.5px;
        background: #fff;
        border-radius: 10px;
      }

      .plus span:last-child {
        position: absolute;
        width: 1.5px;
        height: 10px;
        background: #fff;
        border-radius: 10px;
        transition: transform 0.4s ease !important;
      }

      .feature-item.active .plus {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.4);
      }

      .feature-item.active .plus span:last-child {
        transform: rotate(90deg);
        opacity: 0;
      }

      .feature-item:hover .plus {
        border-color: rgba(255, 255, 255, 0.5);
      }

      /* TITLE */
      .feature-title {
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.02em;
        white-space: nowrap !important;
        flex-shrink: 0 !important;
      }

      /* SUBMENU PANEL */
      .submenu-panel {
        position: absolute !important;
        left: calc(100% + 16px) !important;
        top: 0;
        width: 320px !important;
        background: rgba(40, 40, 40, 0.85) !important;
        backdrop-filter: blur(22px) !important;
        border: 1px solid rgba(59, 130, 246, 0.8) !important;
        border-radius: 20px !important;
        padding: 24px !important;
        z-index: 10 !important;
        display: none;
        opacity: 0;
      }

      /* BRIDGE GAP TO PREVENT MOUSELEAVE WHEN ENTERING SUBMENU */
      .submenu-panel::before {
        content: "";
        position: absolute;
        top: 0;
        left: -30px;
        width: 30px;
        height: 100%;
        background: transparent;
      }

      .submenu-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .submenu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 18px 10px 20px;
        border-radius: 100px;
        cursor: pointer;
        transition: all 0.25s ease;
        color: #fff;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.068) !important;
      }

      .submenu-item-left {
        display: flex;
        align-items: center;
        gap: 0 !important;
      }

      .submenu-item:hover {
        background: rgba(255, 255, 255, 0.12) !important;
        transform: translateX(4px) !important;
      }

      .submenu-right-arrow {
        color: #fff !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        opacity: 0.75; /* Visible by default */
        transition: opacity 0.25s ease !important;
      }

      .submenu-item:hover .submenu-right-arrow {
        opacity: 1 !important;
      }

      .submenu-item-title {
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      /* MOBILE */
      @media (max-width: 1024px) {
        body {
          padding: 0;
        }

        .mac-section {
          height: auto !important;
          min-height: fit-content !important;
          border-radius: 0 !important;
          padding-top: 80px !important;
          padding-bottom: 60px !important;
        }

        .bg-images,
        .overlay {
          height: 100% !important;
          width: 100% !important;
          bottom: 0 !important;
        }

        .content {
          height: auto;
          align-items: flex-start;
          padding: 0;
        }

        .left-panel {
          width: 100% !important;
          padding: 0 20px !important;
        }

        .feature-list {
          padding-left: 0 !important;
          width: 100% !important;
        }

        .feature-item {
          width: 100% !important;
          min-width: 0 !important;
          height: auto !important;
          min-height: 54px !important;
          border-radius: 20px !important;
          overflow: hidden !important;
          flex-direction: column !important; /* Stack button and submenu vertically */
          align-items: stretch !important;
        }

        .feature-button {
          height: 54px !important; /* Fixed height so it doesn't collapse when parent is height: auto */
          flex-shrink: 0 !important;
        }

        .submenu-panel {
          position: relative !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          height: auto;
          box-sizing: border-box !important;
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          backdrop-filter: none !important;
          padding: 0 16px !important;
          margin: 0 !important;
          display: none;
          overflow: hidden !important;
        }

        .submenu-list {
          padding-left: 0 !important;
          padding-right: 0 !important;
          padding-top: 0 !important;
          padding-bottom: 16px !important;
          border-left: none !important;
          gap: 10px !important;
          width: 100% !important;
          box-sizing: border-box !important;
        }

        .submenu-item {
          width: 100% !important;
          box-sizing: border-box !important;
          padding: 10px 16px !important;
        }

        .side-nav {
          display: none;
        }
      }
    </style>
  </head>

                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </div>
              </button>
            </div>

            <!-- ITEM 6: Start Up -->
            <div class="feature-item link-item">
              <button class="feature-button">
                <div class="feature-button-left">
                  <span class="feature-title">Start Up</span>
                </div>
                <div class="right-arrow">
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </div>
              </button>
            </div>

            <!-- ITEM 7: Car Rental -->
            <div class="feature-item link-item">
              <button class="feature-button">
                <div class="feature-button-left">
                  <span class="feature-title">Car Rental</span>
                </div>
                <div class="right-arrow">
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                  </svg>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <script>
      const items = document.querySelectorAll(".feature-item");
      const images = document.querySelectorAll(".bg-image");

      let currentIndex = 0;

      /* INIT */
      gsap.set(images[0], {
        opacity: 1,
        scale: 1,
      });

      /* HOVER LOGIC FOR DESKTOP & CLICK LOGIC FOR MOBILE ACCORDION */
      const isMobile = () =>
        window.matchMedia("(max-width: 1024px)").matches ||
        "ontouchstart" in window ||
        navigator.maxTouchPoints > 0;

      items.forEach((item, index) => {
        /* DESKTOP HOVER */
        item.addEventListener("mouseenter", () => {
          if (isMobile()) return; /* Ignore mouseenter simulation on mobile */
          if (item.classList.contains("active")) return;
          activateItem(index);
        });

        /* MOBILE CLICKABLE ACCORDION */
        item.addEventListener("click", () => {
          if (!isMobile()) return; /* Ignore click on desktop */

          if (item.classList.contains("active")) {
            /* CLOSE ALREADY ACTIVE ACCORDION ITEM */
            item.classList.remove("active");
            gsap.to(item, {
              width: "100%",
              duration: 0.5,
              ease: "power3.out",
              overwrite: "auto",
            });

            const oldSubmenu = item.querySelector(".submenu-panel");
            if (oldSubmenu) {
              gsap.to(oldSubmenu, {
                height: 0,
                opacity: 0,
                duration: 0.4,
                ease: "power3.inOut",
                overwrite: "auto",
                onComplete: () => {
                  gsap.set(oldSubmenu, { display: "none" });
                },
              });
            }
          } else {
            /* OPEN NEW ACCORDION ITEM */
            activateItem(index);
          }
        });
      });

      function activateItem(targetIndex) {
        const item = items[targetIndex];

        /* INSTANTLY HIDE/COLLAPSE OLD ITEMS */
        items.forEach((el) => {
          if (el !== item && el.classList.contains("active")) {
            el.classList.remove("active");
            gsap.to(el, {
              width: isMobile() ? "100%" : "fit-content",
              duration: 0.5,
              ease: "power3.out",
              overwrite: "auto",
            });

            const oldSubmenu = el.querySelector(".submenu-panel");
            if (oldSubmenu) {
              if (!isMobile()) {
                gsap.set(oldSubmenu, { display: "none", opacity: 0 });
              } else {
                gsap.to(oldSubmenu, {
                  height: 0,
                  opacity: 0,
                  duration: 0.4,
                  ease: "power3.inOut",
                  overwrite: "auto",
                  onComplete: () => {
                    gsap.set(oldSubmenu, { display: "none" });
                  },
                });
              }
            }
          }
        });

        /* ADD ACTIVE TO CURRENT AND ANIMATE TO 300PX (OR 100% ON MOBILE) */
        item.classList.add("active");

        const isLink = item.classList.contains("link-item");
        gsap.to(item, {
          width: isMobile() ? "100%" : isLink ? "fit-content" : 300,
          duration: 0.5,
          ease: "power3.out",
          overwrite: "auto",
        });

        /* CALCULATE EXACT TOP OFFSET AND FULL HEIGHT FOR SUBMENU PANEL */
        const submenu = item.querySelector(".submenu-panel");
        const featureListEl = document.querySelector(".feature-list");
        if (submenu && featureListEl) {
          if (!isMobile()) {
            /* DESKTOP FLYOUT BEHAVIOR */
            const listRect = featureListEl.getBoundingClientRect();
            const itemRect = item.getBoundingClientRect();
            submenu.style.top = listRect.top - itemRect.top + "px";
            submenu.style.height = listRect.height + "px";

            gsap.fromTo(
              submenu,
              { display: "block", opacity: 0, x: -10, y: 0 },
              {
                opacity: 1,
                x: 0,
                y: 0,
                duration: 0.2,
                ease: "power2.out",
                overwrite: "auto",
              },
            );

            const subItems = submenu.querySelectorAll(".submenu-item");
            if (subItems.length > 0) {
              gsap.fromTo(
                subItems,
                { opacity: 0, y: 12 },
                {
                  opacity: 1,
                  y: 0,
                  duration: 0.35,
                  stagger: 0.03,
                  ease: "power2.out",
                  overwrite: "auto",
                  delay: 0.05,
                },
              );
            }
          } else {
            /* MOBILE ACCORDION BEHAVIOR - PURE, SOLID HEIGHT ANIMATION */
            submenu.style.top = "0px";
            submenu.style.display = "block";
            submenu.style.height = "auto";
            const targetHeight = submenu.scrollHeight;

            const subItems = submenu.querySelectorAll(".submenu-item");
            gsap.set(subItems, { opacity: 1, x: 0, y: 0 });

            gsap.fromTo(
              submenu,
              { height: 0, opacity: 0 },
              {
                height: targetHeight,
                opacity: 1,
                duration: 0.4,
                ease: "power3.inOut",
                overwrite: "auto",
                onComplete: () => {
                  submenu.style.height = "auto";
                },
              },
            );
          }
        }

        /* SWITCH BACKGROUND IMAGE CLEANLY */
        switchImage(targetIndex);
        currentIndex = targetIndex;
      }

      /* IMAGE SWITCH */
      function switchImage(index) {
        images.forEach((img, i) => {
          if (i === index) {
            gsap.fromTo(
              img,
              { scale: 1.03, opacity: 0 },
              {
                opacity: 1,
                scale: 1,
                duration: 1.2,
                ease: "power2.out",
                overwrite: "auto",
              },
            );
          } else {
            gsap.to(img, {
              opacity: 0,
              scale: 1.02,
              duration: 1.0,
              ease: "power2.out",
              overwrite: "auto",
            });
          }
        });
      }

      /* PREV / NEXT BUTTON LOGIC */
      document.getElementById("prevBtn").addEventListener("click", () => {
        currentIndex--;
        if (currentIndex < 0) {
          currentIndex = items.length - 1;
        }
        activateItem(currentIndex);
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        currentIndex++;
        if (currentIndex >= items.length) {
          currentIndex = 0;
        }
        activateItem(currentIndex);
      });

      /* CLOSE BTN */
      const closeBtn = document.getElementById("closeBtn");
      if (closeBtn) {
        closeBtn.addEventListener("click", () => {
          items.forEach((item) => {
            item.classList.remove("active");
            gsap.to(item, {
              width: isMobile() ? "100%" : "fit-content",
              duration: 0.5,
              ease: "power3.out",
              overwrite: "auto",
            });

            const oldSubmenu = item.querySelector(".submenu-panel");
            if (oldSubmenu) {
              gsap.to(oldSubmenu, {
                opacity: 0,
                x: isMobile() ? 0 : -10,
                height: isMobile() ? 0 : null,
                duration: 0.25,
                ease: "power2.in",
                overwrite: "auto",
                onComplete: () => {
                  gsap.set(oldSubmenu, { display: "none" });
                },
              });
            }
          });
        });
      }

      /* MOUSELEAVE FROM ENTIRE MENU */
      const featureList = document.querySelector(".feature-list");
      if (featureList) {
        featureList.addEventListener("mouseleave", () => {
          if (isMobile())
            return; /* ON MOBILE/TABLET, IGNORE MOUSELEAVE COMPLETELY */
          items.forEach((item) => {
            if (item.classList.contains("active")) {
              item.classList.remove("active");
              gsap.to(item, {
                width: isMobile() ? "100%" : "fit-content",
                duration: 0.5,
                ease: "power3.out",
                overwrite: "auto",
              });

              const oldSubmenu = item.querySelector(".submenu-panel");
              if (oldSubmenu) {
                gsap.to(oldSubmenu, {
                  opacity: 0,
                  x: isMobile() ? 0 : -10,
                  height: isMobile() ? 0 : null,
                  duration: 0.25,
                  ease: "power2.in",
                  overwrite: "auto",
                  onComplete: () => {
                    gsap.set(oldSubmenu, { display: "none" });
                  },
                });
              }
            }
          });
        });
      }
    </script>
  </body>
</html>
